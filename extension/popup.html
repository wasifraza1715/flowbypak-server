<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:16px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2a2a2a}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.connected .dot{background:#00ff88;box-shadow:0 0 8px #00ff8844}
.disconnected .dot{background:#ff4444}
.pending .dot{background:#ffaa00}
.status-sub{font-size:12px;color:#888;margin-top:2px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
.label{color:#888}
.val{color:#fff;font-weight:500}
.btn{width:100%;padding:10px;margin-top:8px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-p{background:#00ff88;color:#000}
.btn-p:hover{background:#00cc6a}
.btn-s{background:#2a2a2a;color:#e0e0e0}
.btn-s:hover{background:#3a3a3a}
.btn-r{background:#441111;color:#ff6666}
.btn-r:hover{background:#661111}
.inp{width:100%;padding:8px 12px;margin-top:4px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff;font-size:12px}
.inp::placeholder{color:#555}
.flex{display:flex;gap:6px;margin-top:6px}
.flex .btn{flex:1;margin:0}
.ftr{margin-top:14px;text-align:center;font-size:10px;color:#444;line-height:1.6}
hr{border:none;border-top:1px solid #1a1a1a;margin:10px 0}
</style>
</head>
<body>

<div class="header" id="hdr">
  <span class="dot" id="dot"></span>
  <div>
    <div style="font-weight:600;font-size:14px">Flow by Pak</div>
    <div class="status-sub" id="sub">Initializing...</div>
  </div>
</div>

<div class="row"><span class="label">Status</span><span class="val" id="st">—</span></div>
<div class="row"><span class="label">Email</span><span class="val" id="em">—</span></div>
<div class="row"><span class="label">Days Left</span><span class="val" id="days">—</span></div>
<div class="row"><span class="label">Last Sync</span><span class="val" id="ls">—</span></div>

<button class="btn btn-p" id="syncBtn">⟳ Sync Now</button>
<button class="btn btn-s" id="reloadBtn">↻ Reload Google Tabs</button>
<button class="btn btn-r" id="clearBtn">✕ Clear Google Cookies</button>

<hr>
<label style="font-size:11px;color:#666">Server URL</label>
<input class="inp" id="srv" placeholder="https://your-server.com">
<div class="flex">
  <button class="btn btn-s" id="setSrv">Set Server</button>
  <button class="btn btn-s" id="testSrv">Test</button>
</div>

<hr>

<label style="font-size:11px;color:#666">Manual Cookie Inject (JSON)</label>
<textarea class="inp" id="rawCookies" rows="4" placeholder='[{"name":"...","value":"...","domain":".google.com","path":"/","secure":true}]' style="resize:vertical;font-family:monospace;font-size:11px"></textarea>
<button class="btn btn-s" id="injectBtn">Inject Manually</button>

<div class="ftr">Self-hosted · Full control · 5 year lease</div>

<script src="popup.js"></script>
</body>
</html>
